<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Tests - Ne-thuniga</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); 
            color: #ffffff; min-height: 100vh; position: relative; overflow-x: hidden;
        }
        .stars-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
            background: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                        radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0));
            background-repeat: repeat; background-size: 200px 200px; opacity: 0.6; animation: twinkle 4s infinite linear;
        }
        @keyframes twinkle { 0% { opacity: 0.3; } 50% { opacity: 0.8; } 100% { opacity: 0.3; } }

        header { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-size: 1.5rem; font-weight: 700; text-decoration: none; color: #38bdf8; }
        .hamburger { font-size: 1.5rem; background: none; border: none; color: white; cursor: pointer; }
        .nav-links { display: none; flex-direction: column; position: absolute; top: 100%; right: 0; background: #1e293b; width: 220px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); list-style: none; border-radius: 0 0 0 12px; }
        .nav-links.active { display: flex; }
        .nav-links li a { display: block; padding: 12px 20px; color: #f1f5f9; text-decoration: none; }

        .container { position: relative; z-index: 1; max-width: 900px; margin: 3rem auto; padding: 0 1.5rem; }
        h2 { color: #38bdf8; margin-bottom: 1.5rem; }
        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 1.5rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 1.5rem; }
        .btn { display: inline-block; padding: 8px 20px; background: #38bdf8; color: #0f172a; font-weight: 600; border-radius: 6px; text-decoration: none; margin-top: 10px; }
        footer { position: relative; z-index: 1; text-align: center; padding: 2rem; background: rgba(15, 23, 42, 0.9); color: #94a3b8; margin-top: 5rem; }
    </style>
</head>
<body>
    <div class="stars-bg"></div>
    <header>
        <a href="{% url 'home' %}" class="logo"><i class="fa-solid fa-graduation-cap"></i> Ne-thuniga</a>
        <button class="hamburger" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
        <ul class="nav-links" id="navLinks">
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'mock_test' %}">Mock Tests</a></li>
            <li><a href="{% url 'pdf_notes' %}">PDF Materials</a></li>
            <li><a href="{% url 'videos' %}">Videos</a></li>
            <li><a href="{% url 'about' %}">About Us</a></li>
        </ul>
    </header>

    <div class="container">
        <h2>Online Mock Tests 📝</h2>
        <div class="card">
            <h3>Mock Test 1 - General Studies</h3>
            <p style="color: #cbd5e1; margin-top: 5px;">100 Questions | Time: 90 Mins</p>
            <a href="#" class="btn">Start Test</a>
        </div>
    </div>

    <footer><p>&copy; 2026 Ne-thuniga Portal. All Rights Reserved.</p></footer>
    <script>document.getElementById('menuToggle').addEventListener('click', () => document.getElementById('navLinks').classList.toggle('active'));</script>
</body>
</html>
